{{define "newpost.html"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookies Book Forum</title>
    <link rel="stylesheet" href="/static/reset.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="/static/newpost.css">
    <link rel="stylesheet" href="/static/mainstyle.css">
    <link rel="stylesheet" href="/static/footer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/media/favicon.png" />
</head>

<body>
    {{ template "header.html" . }}

    <div class="container-main">
        <div class="form-container">
            <p class="title">Create</p>
            <p class="title">a</p>
            <p class="title">New Post</p>
            <form class="form" action="/newpost" method="POST">

                <!------------------------------ category ------------------------------>
                <!------------------------------ category ------------------------------>
                <div class="category-bar">
                    <div class="filter-dropdown">
                        <button type="button" class="filter-button">Category<span
                                class="dropdown-arrow">▼</span></button>
                        <div class="dropdown-content">
                            {{range .Categories}}
                            <input type="radio" name="category" value="{{.ID}}" id="cat-{{.ID}}" style="display: none;">
                            <label for="cat-{{.ID}}" class="category-link">{{.Name}}</label>
                            {{end}}
                        </div>
                    </div>
                </div>
                <!------------------------------ t ------------------------------>
                <div class="input-group">
                    <label for="username">Title</label>
                    <input type="title" name="title" id="title" placeholder="">
                </div>

                <!------------------------------ Post text ------------------------------>
                <div class="input-group">
                    <label for="newpost">Post</label>
                    <textarea id="post-content" name="content" class="form-textarea content-textarea" placeholder=""
                        required>
                    </textarea>
                </div>

                <div class="form-actions">
                    <button class="button">Post</button>
                    <button class="button-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    {{ template "footer.html" . }}
</body>

</html>
{{end}}
