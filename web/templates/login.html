{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookies Book Forum</title>
    <link rel="stylesheet" href="/static/reset.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="/static/darkmode.css">
    <link rel="stylesheet" href="/static/login.css">
    <link rel="stylesheet" href="/static/mainstyle.css">
    <link rel="stylesheet" href="/static/footer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/media/favicon.png" />
</head>

<body {{if .DarkMode}}class="dark-mode"{{end}}></body>
    {{if .CurrentUser}}
    {{ template "user_header.html" . }}
    {{else}}
    {{ template "header.html" . }}
    {{end}}
    <div class="container-main">
        <div class="form-container">
            <p class="title">Welcome</p>
            <p class="title">back</p>
            <p class="title">Bookie</p>
            <!------------------------------ Login Form ------------------------------>
            <form class="form" action="/login" method="POST">
                <div class="input-group">
                    <label for="username">Email</label>
                    <input type="text" name="email" id="email" placeholder="" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="" required>
                    <div class="forgot">
                       <a rel="noopener noreferrer" href="/forgot-password">Forgot Password ?</a>
                    </div>
                </div>
                <button type="submit" class="sign">Sign in</button>
            </form>
            <p class="signup">Don't have an account yet?
                <a rel="noopener noreferrer" href="/register" class="">Sign up</a>
            </p>

            <!-- Display error messages -->
            {{if .Error}}
            <div class="error-message">
                <p>{{.Error}}</p>
            </div>
            {{end}}

        </div>
    </div>
    {{ template "footer.html" . }}
</body>

</html>
{{end}}
